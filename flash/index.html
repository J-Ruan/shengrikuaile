<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100810">
  <title>徐凡，生日快乐呀！</title>
  <link rel="icon" type="image/svg+xml" href="../src/icon.svg">
  <link rel="stylesheet" href="../birthday.css">
  <link rel="stylesheet" href="../v2/stardust.css?v=2">
  <link rel="stylesheet" href="../v3/star-notes.css?v=3">
  <style>
    #quick-countdown {
      font: bold clamp(8rem, 32vmin, 18rem)/1 Arial, sans-serif;
      color: #fff3fa;
      filter: drop-shadow(0 0 .055em #efabd2);
    }
    @supports ((background-clip: text) or (-webkit-background-clip: text)) {
      #quick-countdown {
        background: radial-gradient(circle, #fff6fc 30%, #ffc7e2 45%, transparent 66%) 0 0 / .023em .023em;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
    }
    @media (prefers-reduced-motion: no-preference) {
      #quick-countdown { animation: gather-digit 1.2s ease-out infinite; }
      @keyframes gather-digit {
        from { opacity: .65; transform: scale(1.12); }
        35%, to { opacity: 1; transform: scale(1); }
      }
    }
  </style>
</head>
<body>
  <!-- Adapted from mnbvcxzz1375/HappyBirthday (ecb8da3).
       Original particle choreography: https://github.com/mnbvcxzz1375/HappyBirthday -->
  <audio id="bgm" loop preload="none" src="./jiangguo.m4a"></audio>
  <main>
    <div id="canvas-container" tabindex="-1" aria-label="按住左右拖动或使用左右方向键旋转生日蛋糕">
      <div id="stardust-words" role="group" aria-label="星尘里的印象" hidden>
        <span><button class="note-word" type="button" aria-expanded="false" aria-controls="star-note" data-note="有些话在输入框里删了又写，想到是你，我就敢发出去了">温柔</button></span>
        <span><button class="note-word" type="button" aria-expanded="false" aria-controls="star-note" data-note="跟你聊天的时候，我的“再聊五分钟”一向不太准">有趣</button></span>
        <span><button class="note-word" type="button" aria-expanded="false" aria-controls="star-note" data-note="猜你看到这儿正想说“你才傻”，行，这条算咱俩的">傻傻的</button></span>
        <span><button class="note-word" type="button" aria-expanded="false" aria-controls="star-note" data-note="你总会替别人想一想。今天寿星最大，先挑你自己喜欢的">善良</button></span>
        <span><button class="note-word" type="button" aria-expanded="false" aria-controls="star-note" data-note="没关系，你的生日我记得">记性差</button></span>
        <span><button class="note-word" type="button" aria-expanded="false" aria-controls="star-note" data-note="事情交给你，我就觉得踏实。哪天你忙不过来，也分我一件">负责任</button></span>
        <span><button class="note-word" type="button" aria-expanded="false" aria-controls="star-note" data-note="你笑起来真好看，这句我争取下次当面也敢说">漂亮</button></span>
        <span><button class="note-word" type="button" aria-expanded="false" aria-controls="star-note" data-note="想请你吃顿早餐，几点起床都算">不吃早餐</button></span>
        <span><button class="note-word" type="button" aria-expanded="false" aria-controls="star-note" data-note="我有机会一定要尝尝">苦菊</button></span>
        <span><button class="note-word" type="button" aria-expanded="false" aria-controls="star-note" data-note="今天加香菜了吗">香菜</button></span>
        <span><button class="note-word" type="button" aria-expanded="false" aria-controls="star-note" data-note="下次想吃辣的时候，叫上我呀">爱吃辣</button></span>
      </div>
    </div>
    <div id="countdown-label" class="visually-hidden" role="status"></div>

    <section id="start-overlay" aria-labelledby="greeting">
      <span id="quick-countdown" aria-hidden="true" hidden></span>
      <div class="start-card glass-panel">
        <h1 id="greeting">叮~徐凡，<wbr><span>你的生日祝福到啦</span></h1>
        <button type="button" class="primary-button" id="start-btn" hidden>开始</button>
        <div id="basic-preview">
          <details id="basic-card">
            <summary class="primary-button">打开贺卡</summary>
            <img id="birthday-cover" src="./cover.webp" loading="lazy" decoding="async" fetchpriority="low" width="768" height="714" alt="黑色手绘生日蛋糕和彩旗，配有 Happy Birthday 字样">
            <div id="letter">
              <p>徐凡，生日快乐呀！</p>
              <p>本来发条消息就能说完这句话，可一想到是你，我就想多做一点。</p>
              <p>希望新的一岁，诸事顺遂。</p>
            </div>
          </details>
          <p class="preview-help">这里可以先读贺卡。要看粒子动画，请在浏览器里打开。</p>
        </div>
      </div>
    </section>

    <header id="top-banner" hidden>
      <h2>Happy Birthday</h2>
      <p>Best Wishes for You</p>
    </header>

    <div id="tools" hidden>
      <button class="round-button" id="settings-toggle" type="button" aria-label="蛋糕调色盘" title="蛋糕调色盘" aria-expanded="false" aria-controls="settings-panel">🎨</button>
      <button class="round-button" id="music-btn" type="button" aria-label="背景音乐" title="播放背景音乐" aria-pressed="false">🎵</button>
      <div id="settings-panel" hidden>
        <label>底层颜色 <input id="picker-bottom" type="color" value="#ff69b4" data-layer="bottom"></label>
        <label>顶层颜色 <input id="picker-top" type="color" value="#ffb6c1" data-layer="top"></label>
        <label>奶油颜色 <input id="picker-cream" type="color" value="#ffffff" data-layer="cream"></label>
      </div>
    </div>

    <section id="wish-controls" hidden aria-labelledby="wish-hint">
      <p id="wish-hint">长按蛋糕 2 秒，许个愿吧</p>
      <progress id="wish-meter" max="1" value="0" aria-label="长按许愿进度"></progress>
    </section>

    <section id="surprise-layer" hidden aria-label="生日贺卡">
      <button class="gift-button" id="reveal-btn" type="button">🎁 打开礼物</button>
      <article id="flip-card-container" hidden aria-label="给徐凡的贺卡">
        <div class="flip-card-inner">
          <div class="card-face card-front" id="card-front">
            <button type="button" class="primary-button" id="flip-btn">翻开贺卡</button>
          </div>
          <div class="card-face card-back" id="card-back" inert aria-hidden="true">
            <div class="letter-body">
              <span class="envelope" aria-hidden="true">💌</span>
            </div>
            <button type="button" class="quiet-button" id="close-card-btn">再陪我看会儿星星</button>
          </div>
        </div>
      </article>
    </section>

    <p id="rotate-hint" hidden>按住左右拖动，轻点带 ✦ 的词</p>
    <div id="note-dock" role="status" aria-live="polite" aria-atomic="true">
      <p id="star-note" aria-hidden="true"></p>
    </div>
    <button class="round-button" id="floating-gift-btn" type="button" hidden title="再读一次贺卡" aria-label="再读一次贺卡">🎁</button>
  </main>
  <script>
    (() => {
      const start = document.getElementById('start-btn');
      const music = document.getElementById('bgm');
      const cover = document.getElementById('birthday-cover');
      const preview = document.getElementById('basic-preview');
      const reader = document.getElementById('basic-card');
      const help = preview.querySelector('.preview-help');
      const greeting = start.closest('.start-card');
      const number = document.getElementById('quick-countdown');
      const status = document.getElementById('countdown-label');
      let loading = false;
      let requested = false;
      let ready = false;
      let remaining = 3;
      let countdownTimer;

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.async = false;
          script.onload = resolve;
          script.onerror = reject;
          script.src = src;
          document.head.append(script);
        });
      }

      function showReader() {
        clearTimeout(countdownTimer);
        number.hidden = true;
        greeting.hidden = false;
        start.hidden = true;
        preview.hidden = false;
        help.textContent = '动画暂时加载失败，可以在这里读贺卡。';
        if (requested) {
          status.textContent = help.textContent;
          reader.open = true;
        }
      }

      function enterCake() {
        document.getElementById('start-overlay').hidden = true;
        document.getElementById('tools').hidden = false;
        showCake();
        updateMusicButton();
        document.getElementById('canvas-container').focus();
      }

      function countDown() {
        if (remaining > 0) {
          number.textContent = status.textContent = String(remaining);
          countdownTimer = setTimeout(() => {
            remaining--;
            countDown();
          }, 1200);
        } else if (ready) {
          enterCake();
        } else {
          number.hidden = true;
          greeting.hidden = false;
          start.textContent = status.textContent = '正在准备蛋糕…';
          preview.hidden = false;
          help.textContent = '星光还在加载，你也可以先读贺卡。';
        }
      }

      function sceneReady() {
        if (!document.documentElement.classList.contains('interactive')) {
          // The greeting waits for an open paper card to be closed before moving its contents.
          if (reader.open) reader.addEventListener('toggle', sceneReady, { once: true });
          else showReader();
          return;
        }
        ready = true;
        start.removeEventListener('click', startEarly);
        if (document.getElementById('start-overlay').hidden) {
          clearTimeout(countdownTimer);
          return;
        }
        // The first tap already started the clock. Only hand off once it reaches zero.
        if (requested && remaining === 0) enterCake();
      }

      async function loadScene() {
        if (loading) return;
        loading = true;
        if (!requested) music.preload = 'metadata';
        cover.loading = 'eager';
        const controller = '../v3/birthday.js?v=3';
        const preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'script';
        preload.href = controller;
        document.head.append(preload);
        try {
          await Promise.all([
            '../src/vendor/three.r128.min.js',
            '../particles.js?v=6',
            '../v2/stardust-words.js',
            '../v3/star-notes.js?v=3'
          ].map(loadScript));
          if (typeof StardustNotes === 'undefined') throw new Error('Star notes unavailable');
          await loadScript(controller);
          sceneReady();
        } catch {
          showReader();
        }
      }

      function startEarly(event) {
        event.stopImmediatePropagation();
        if (requested) return;
        requested = true;
        start.disabled = true;
        greeting.hidden = true;
        number.hidden = false;
        countDown();
        // Start playback within the actual tap, even if the animation is still downloading.
        music.volume = .5;
        music.play().catch(() => {});
        loadScene();
      }

      cover.addEventListener('error', () => {
        cover.src = '../v2/com.ss.android.ugc.aweme.lite_20261124175045.png';
      }, { once: true });
      start.addEventListener('click', startEarly);
      preview.hidden = true;
      start.hidden = location.hash === '#stars';
      requestAnimationFrame(() => requestAnimationFrame(loadScene));
    })();
  </script>
</body>
</html>
